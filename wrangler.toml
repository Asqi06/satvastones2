name = "satvastones2"
main = "src/worker.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = [
  "/",
  "/api/*",
  "/products/*",
  "/journal",
  "/journal/*",
  "/blog",
  "/blog/*",
  "/shop",
  "/shop/*",
  "/collections/*",
  "/gifts-for-girlfriend-under-500",
  "/anti-tarnish-jewellery-vapi",
  "/affordable-anti-tarnish-jewellery-india",
  "/stack-builder",
  "/llms.txt",
  "/llms-full.txt",
  "/policies/*",
  "/sitemap.xml",
  "/feeds/*",
  "/google-merchant.xml",
  "/feed.xml"
]

[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "satvastones-db"
database_id = "ffa03bf8-6cf8-453d-b6da-fc8ca71b4603"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "satvastones-media"

[vars]
ENVIRONMENT = "production"
ADMIN_USERNAME = "@dmin"
BRAND_NAME = "Satvastones Jewellery"
PROPRIETOR_NAME = "Anirudh A Verma"
GSTIN = "24DDAPV4074H1ZF"
STORE_LOCATION = "Chala, Vapi, Gujarat - 396191, India"
FREE_SHIPPING_THRESHOLD_PAISE = "49900"
SUPPORT_EMAIL = "support@satvastones.in"
INDEXNOW_KEY = "4a74081716f7911fc669473a0f950b01"
